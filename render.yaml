# ==============================================================================
# RENDER BLUEPRINT - ROTA FÁCIL SP
# Deploy unificado: Backend Flask + Frontend React Static Site com SPA Rewrite
# ==============================================================================

services:
  # 1. API Flask (Back-end)
  - type: web
    name: rota-facil-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PORT
        value: 5000
      - key: FLASK_ENV
        value: production
      - key: ADMIN_TOKEN
        value: ADMIN123
      - key: SECRET_KEY
        generateValue: true

  # 2. Front-end React SPA (Static Site)
  - type: static
    name: rota-facil-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: npm run build
    staticPublishPath: dist
    # Regra essencial de SPA no Render para evitar erro 404 ao atualizar a página (F5)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rota-facil-backend
          property: host
