<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RotaFacil SP — Redirecionando...</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        text-align: center;
      }
      .card {
        padding: 32px;
        border-radius: 16px;
        background: #1e293b;
        border: 1px solid #334155;
        max-width: 400px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #38bdf8;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      a {
        color: #38bdf8;
        text-decoration: none;
        font-weight: bold;
      }
    </style>
    <script>
      // Redireciona imediatamente para a raiz preservando o caminho da SPA
      var path = window.location.pathname;
      if (path && path !== "/" && path !== "/404.html") {
        sessionStorage.setItem("rf_redirect_path", path + window.location.search + window.location.hash);
      }
      window.location.replace("/" + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <p style="font-size: 15px; font-weight: 600;">Carregando RotaFácil SP...</p>
      <p style="font-size: 12px; color: #94a3b8;">Redirecionando você para o sistema...</p>
      <p style="font-size: 11px; margin-top: 16px;"><a href="/">Clique aqui se não carregar</a></p>
    </div>
  </body>
</html>
