<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Route Accent Line -->
  <path d="M12 48 Q 28 36, 36 42 T 52 26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" />

  <!-- Delivery Truck Graphic -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Cargo Box -->
    <rect x="13" y="22" width="22" height="18" rx="2" />
    <!-- Cabin -->
    <path d="M35 27 L43 27 C44.5 27 46 28.5 46.8 30 L49 34 C49.6 35.2 50 36.5 50 38 L50 40 L35 40 Z" />
    <!-- Cabin Window -->
    <path d="M37 29 L42.5 29 C43.5 29 44.5 30 45 31.2 L46.5 34 L37 34 Z" fill="#0284c7" />
    <!-- Left Wheel Well & Wheel -->
    <circle cx="21" cy="41" r="5" fill="#0f172a" />
    <circle cx="21" cy="41" r="2.5" fill="#e2e8f0" />
    <!-- Right Wheel Well & Wheel -->
    <circle cx="43" cy="41" r="5" fill="#0f172a" />
    <circle cx="43" cy="41" r="2.5" fill="#e2e8f0" />
    <!-- Headlight -->
    <rect x="49" y="36" width="2" height="3" rx="1" fill="#facc15" />
    <!-- Cargo Stripes -->
    <rect x="17" y="26" width="2" height="10" rx="1" fill="#38bdf8" />
    <rect x="22" y="26" width="2" height="10" rx="1" fill="#38bdf8" />
  </g>

  <!-- Small Location / Route Pin Accent -->
  <g transform="translate(42, 10)">
    <circle cx="7" cy="7" r="5" fill="url(#pinGrad)" />
    <circle cx="7" cy="7" r="2" fill="#ffffff" />
  </g>
</svg>

